<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c1117" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Donaive" />
    <title>Donaive — Sistemas, automatización e inteligencia para organizaciones</title>
    <meta
      name="description"
      content="Donaive analiza problemas, diseña procesos y desarrolla sistemas, automatización e inteligencia artificial para ayudar a las organizaciones a funcionar mejor."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var host = location.hostname.toLowerCase();
          if (host === "polisur.com.ve" || host === "www.polisur.com.ve") {
            var escudo = "/polisur/logo/escudo.png";
            document.querySelectorAll('link[rel="icon"]').forEach(function (el) {
              el.type = "image/png";
              el.href = escudo;
            });
            var appleIcon = document.querySelector('link[rel="apple-touch-icon"]');
            if (!appleIcon) {
              appleIcon = document.createElement("link");
              appleIcon.rel = "apple-touch-icon";
              document.head.appendChild(appleIcon);
            }
            appleIcon.href = escudo;
            document.title = "POLISUR — Portal institucional";
            var appTitle = document.querySelector(
              'meta[name="apple-mobile-web-app-title"]',
            );
            if (appTitle) appTitle.content = "POLISUR";
          }
        } catch (e) {}
      })();
    </script>
    <script>
      (function () {
        try {
          var key = "donaive-theme";
          var stored = localStorage.getItem(key);
          var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var resolved =
            stored === "light" || stored === "dark"
              ? stored
              : systemDark
                ? "dark"
                : "light";
          document.documentElement.classList.toggle("dark", resolved === "dark");
          document.documentElement.style.colorScheme = resolved;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
