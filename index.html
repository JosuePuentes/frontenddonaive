<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <title>DONAIVE</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body>
  <div id="root"></div>
  <!-- Suprimir warnings del navegador sobre APIs deprecadas y preload -->
  <script>
    // Suprimir warning de "Deprecated API for given entry type"
    if ('PerformanceObserver' in window) {
      try {
        const observer = new PerformanceObserver(() => {});
        observer.disconnect();
      } catch (e) {
        // Ignorar errores de Performance Observer
      }
    }
    
    // Suprimir warnings de preload no utilizados
    const originalWarn = console.warn;
    console.warn = function(...args) {
      const message = args.join(' ');
      // Filtrar warnings específicos del navegador que no podemos controlar
      if (
        message.includes('preload') && message.includes('not used') ||
        message.includes('Deprecated API') ||
        message.includes('entry type')
      ) {
        return;
      }
      originalWarn.apply(console, args);
    };
    
    // Suprimir errores 404 de servicios externos que no controlamos
    const originalError = console.error;
    console.error = function(...args) {
      const message = args.join(' ');
      // Filtrar solo errores 404 específicos de servicios externos (Vercel, extensiones, etc.)
      // No filtrar otros errores que puedan ser importantes
      if (
        (message.includes('/api/v1/projects/') || message.includes('rapifarma-frontend')) && 
        (message.includes('404') || message.includes('Failed to load resource')) ||
        (message.includes('rolling-release') && message.includes('404'))
      ) {
        return; // Ignorar este error específico de servicio externo
      }
      originalError.apply(console, args);
    };
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
